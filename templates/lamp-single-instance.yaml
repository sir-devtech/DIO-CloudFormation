AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Stack LAMP educacional inspirada no template classico do AWS CloudFormation
  e no Infrastructure Composer visto nas aulas da DIO. Cria uma instancia EC2
  com Apache, PHP e MySQL na VPC padrao da conta.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Par de chaves EC2 existente para acesso SSH

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.nano
      - t2.micro
      - t2.small
      - t2.medium
      - t3.micro
      - t3.small
    Description: Tipo de instancia EC2 (prefira t2.micro no Free Tier)

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR permitido para SSH (recomendado restringir ao seu IP)
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Informe um CIDR valido, ex. 203.0.113.0/32

  DBName:
    Type: String
    Default: MyDatabase
    Description: Nome do banco MySQL
    MinLength: 1
    MaxLength: 64
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9]*$
    ConstraintDescription: Deve comecar com letra e conter apenas alfanumericos

  DBUsername:
    Type: String
    Default: admin
    Description: Usuario administrador do MySQL
    MinLength: 1
    MaxLength: 16
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9]*$

  DBRootPassword:
    Type: String
    NoEcho: true
    Description: Senha root do MySQL (minimo 8 caracteres)
    MinLength: 8
    MaxLength: 41
    AllowedPattern: ^[a-zA-Z0-9]*$
    ConstraintDescription: Minimo 8 caracteres alfanumericos

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuracao da Instancia
        Parameters:
          - KeyName
          - InstanceType
          - SSHLocation
      - Label:
          default: Configuracao do Banco de Dados
        Parameters:
          - DBName
          - DBUsername
          - DBRootPassword
    ParameterLabels:
      KeyName:
        default: Par de Chaves EC2
      InstanceType:
        default: Tipo de Instancia
      SSHLocation:
        default: Acesso SSH (CIDR)
      DBName:
        default: Nome do Banco
      DBUsername:
        default: Usuario do Banco
      DBRootPassword:
        default: Senha Root MySQL

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permite HTTP e SSH para servidor LAMP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web-sg'
        - Key: ManagedBy
          Value: CloudFormation

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          yum update -y
          amazon-linux-extras install -y lamp-mariadb10.2-php7.2
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>LAMP Stack - DIO CloudFormation Lab</h1>" > /var/www/html/index.html
          mysql -e "CREATE DATABASE ${DBName};"
          mysql -e "CREATE USER '${DBUsername}'@'localhost' IDENTIFIED BY '${DBRootPassword}';"
          mysql -e "GRANT ALL ON ${DBName}.* TO '${DBUsername}'@'localhost';"
          mysql -e "FLUSH PRIVILEGES;"
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lamp-server'
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  WebsiteURL:
    Description: URL publica do servidor web
    Value: !Sub 'http://${WebServerInstance.PublicDnsName}'

  PublicDNS:
    Description: DNS publico da instancia EC2
    Value: !GetAtt WebServerInstance.PublicDnsName

  InstanceId:
    Description: ID da instancia EC2
    Value: !Ref WebServerInstance

  SecurityGroupId:
    Description: ID do Security Group criado
    Value: !Ref WebServerSecurityGroup
